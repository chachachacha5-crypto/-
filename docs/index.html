<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>eBay US 関税・送料 概算 (日本→米国)</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131826;
      --panel2: #0f1422;
      --border: #232a3d;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #60a5fa;
      --accent2: #93c5fd;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    h2 { font-size: 15px; margin: 0 0 10px; color: var(--text); }
    h3 { font-size: 13px; margin: 0 0 8px; color: var(--accent); font-weight: 600; }
    p.lead { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.55; }
    .grid { display: grid; gap: 14px; }
    @media (min-width: 820px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .panel + .panel { margin-top: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row.full > * { grid-column: 1 / -1; }
    label.field {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 12px; color: var(--muted);
    }
    .field-inner { display: flex; align-items: center; gap: 6px; }
    select, input[type="number"] {
      width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      -webkit-appearance: none; appearance: none;
    }
    select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%2394a3b8' d='M6 8L0 0h12z'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .suffix { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table th, table td { padding: 6px 4px; text-align: left; }
    table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table thead th { color: var(--muted); font-size: 11px; font-weight: 500; border-bottom: 1px solid var(--border); }
    table tbody tr { border-bottom: 1px solid #1c2233; }
    table tbody tr:last-child { border-bottom: 0; }
    .row-bold td { font-weight: 600; color: var(--text); }
    .row-accent td { color: var(--accent2); font-weight: 600; }
    .ship-row .ship-label { color: var(--text); font-size: 14px; }
    .ship-row .ship-desc { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .ship-row .ship-warn { color: var(--warn); font-size: 11px; margin-top: 4px; }
    .ship-row .sub { color: #64748b; font-size: 11px; }
    .recommended {
      border-color: rgba(96,165,250,0.5);
      background: rgba(96,165,250,0.08);
    }
    .recommended .big {
      font-size: 26px; font-weight: 700; margin-top: 6px;
    }
    .alert {
      border-color: rgba(251,191,36,0.45);
      background: rgba(251,191,36,0.08);
      color: #fde68a;
      font-size: 13px;
    }
    .notes { font-size: 11px; color: var(--muted); line-height: 1.55; padding-left: 18px; margin: 0; }
    .notes li { margin-bottom: 4px; }
    footer { color: #64748b; font-size: 11px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #1f2937; color: var(--muted); margin-right: 6px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>eBay US 関税・送料 概算ツール</h1>
      <p class="lead">
        日本→米国向け販売で、<b>生産国 × カテゴリ × サイズ/重量</b> から関税(2025年相互関税対応)と送料(EMS/eパケット/船便)を概算します。
        計算はブラウザ内で完結します。
      </p>
    </header>

    <div class="grid grid-2">
      <!-- 入力 -->
      <section class="panel">
        <h2>入力</h2>
        <div class="row full">
          <label class="field">
            <span>生産国 (原産国)</span>
            <select id="country"></select>
          </label>
          <label class="field">
            <span>商品カテゴリ</span>
            <select id="category"></select>
          </label>
        </div>
        <div class="row" style="margin-top:10px">
          <label class="field">
            <span>商品代金</span>
            <div class="field-inner"><input id="price" type="number" step="1" min="0" value="100" /><span class="suffix">USD</span></div>
          </label>
          <label class="field">
            <span>為替</span>
            <div class="field-inner"><input id="fx" type="number" step="0.1" min="50" value="155" /><span class="suffix">円/USD</span></div>
          </label>
          <label class="field">
            <span>実重量</span>
            <div class="field-inner"><input id="weight" type="number" step="0.1" min="0" value="1.0" /><span class="suffix">kg</span></div>
          </label>
          <span></span>
          <label class="field">
            <span>長さ (L)</span>
            <div class="field-inner"><input id="lenL" type="number" step="1" min="0" value="30" /><span class="suffix">cm</span></div>
          </label>
          <label class="field">
            <span>横 (W)</span>
            <div class="field-inner"><input id="lenW" type="number" step="1" min="0" value="20" /><span class="suffix">cm</span></div>
          </label>
          <label class="field">
            <span>高 (H)</span>
            <div class="field-inner"><input id="lenH" type="number" step="1" min="0" value="10" /><span class="suffix">cm</span></div>
          </label>
        </div>
        <label class="check" style="margin-top:14px">
          <input id="includeShip" type="checkbox" checked />
          <span>関税の課税ベースに送料を含める (航空便CIFが原則)</span>
        </label>
      </section>

      <!-- 結果 -->
      <section id="result"></section>
    </div>

    <footer>
      税率データは 2025 年後半時点の代表値です。実務では USTR / CBP の最新告示と日本郵便公式の料金表をご確認ください。
    </footer>
  </main>

  <script>
  // ============================================================
  // データテーブル (2025-2026 代表値)
  // ============================================================
  const COUNTRIES = [
    { code:"JP", name:"日本",            r:15, note:"2025年7月の日米合意以降の代表値" },
    { code:"CN", name:"中国",            r:30, note:"2025年5月以降の引下げ後 (品目により更に高い場合あり)" },
    { code:"KR", name:"韓国",            r:15 },
    { code:"TW", name:"台湾",            r:20 },
    { code:"VN", name:"ベトナム",        r:20 },
    { code:"TH", name:"タイ",            r:19 },
    { code:"ID", name:"インドネシア",    r:19 },
    { code:"PH", name:"フィリピン",      r:19 },
    { code:"MY", name:"マレーシア",      r:19 },
    { code:"IN", name:"インド",          r:25 },
    { code:"BD", name:"バングラデシュ",  r:20 },
    { code:"KH", name:"カンボジア",      r:19 },
    { code:"MX", name:"メキシコ",        r:25, note:"USMCA適合品は通常無税" },
    { code:"CA", name:"カナダ",          r:35, note:"USMCA適合品は通常無税" },
    { code:"EU", name:"EU加盟国",        r:15 },
    { code:"GB", name:"イギリス",        r:10 },
    { code:"BR", name:"ブラジル",        r:50 },
    { code:"OTHER", name:"その他 (10%ベース)", r:10 },
  ];

  const CATEGORIES = [
    { code:"apparel",            name:"衣料品 (服全般)",            mfn:15.0 },
    { code:"footwear",           name:"靴・スニーカー",             mfn:12.0 },
    { code:"bags_leather",       name:"バッグ (革製)",              mfn:8.0  },
    { code:"bags_textile",       name:"バッグ (布・合皮)",          mfn:17.6 },
    { code:"watches",            name:"時計",                       mfn:4.0  },
    { code:"jewelry",            name:"ジュエリー・アクセサリー",   mfn:6.5  },
    { code:"electronics",        name:"電子機器 (PC周辺・スマホ等)", mfn:0.0 },
    { code:"cameras",            name:"カメラ・レンズ",             mfn:2.1  },
    { code:"toys_games",         name:"おもちゃ・ゲーム",           mfn:0.0  },
    { code:"hobby_collectibles", name:"ホビー・フィギュア・コレクター品", mfn:0.0 },
    { code:"books_paper",        name:"書籍・紙製品",               mfn:0.0  },
    { code:"kitchenware",        name:"食器・キッチン用品",         mfn:7.0  },
    { code:"cosmetics",          name:"化粧品",                     mfn:0.0  },
    { code:"sporting_goods",     name:"スポーツ用品",               mfn:4.0  },
    { code:"musical_instruments",name:"楽器",                       mfn:4.5  },
    { code:"general",            name:"その他 / 一般雑貨",          mfn:5.0  },
  ];

  // 日本郵便 米国向け料金 (2025年改定後の代表値)
  const EMS = [
    [0.5,3900],[0.6,4180],[0.7,4460],[0.8,4740],[0.9,5020],[1.0,5300],
    [1.25,5975],[1.5,6650],[1.75,7325],[2.0,8000],
    [2.5,9350],[3.0,10650],[3.5,11925],[4.0,13200],[4.5,14450],[5.0,15700],
    [5.5,16975],[6.0,18250],[7.0,20800],[8.0,23350],[9.0,25900],[10.0,28450],
    [12.0,33550],[15.0,41200],[17.5,47475],[20.0,53950],[22.5,60325],[25.0,66700],[27.5,73075],[30.0,79450]
  ];
  const EPACKET = [
    [0.1,1880],[0.2,2280],[0.3,2680],[0.4,3080],[0.5,3480],[0.6,3880],
    [0.7,4280],[0.8,4680],[0.9,5080],[1.0,5480],[1.25,6480],[1.5,7480],[1.75,8480],[2.0,9480]
  ];
  const SURFACE = [
    [1.0,2400],[2.0,3450],[3.0,4500],[4.0,5550],[5.0,6600],[6.0,7650],
    [7.0,8700],[8.0,9750],[9.0,10800],[10.0,11850],[15.0,17100],[20.0,22350]
  ];

  const SHIPPING = [
    { service:"EMS",     label:"EMS (国際スピード郵便)", desc:"追跡・補償あり / 3-7日 / eBayの標準",       table:EMS,     maxKg:30, useVol:true,  divisor:6000 },
    { service:"EPACKET", label:"国際eパケット",          desc:"追跡あり / 7-14日 / 2kgまでの軽量品向け",    table:EPACKET, maxKg:2,  useVol:false, divisor:6000 },
    { service:"SURFACE", label:"船便小包",               desc:"追跡なし(オプション可) / 1-3ヶ月 / 重量物向け", table:SURFACE, maxKg:30, useVol:false, divisor:6000 },
  ];

  // MPF (Merchandise Processing Fee) 2025年率
  const MPF_RATE = 0.003464;
  const MPF_MIN = 32.71;
  const MPF_MAX = 634.62;

  // ============================================================
  // 計算ロジック
  // ============================================================
  function lookupRate(weightKg, table) {
    const last = table[table.length-1][0];
    if (weightKg > last) return null;
    for (const [w, fee] of table) if (weightKg <= w) return fee;
    return null;
  }

  function volWeight(L, W, H, divisor) {
    return (L * W * H) / divisor;
  }

  function calcShipping(opt, actual, L, W, H, fx) {
    const vol = volWeight(L, W, H, opt.divisor);
    const chargeable = opt.useVol ? Math.max(actual, vol) : actual;
    let reason = null;
    let oversize = chargeable > opt.maxKg;
    if (oversize) reason = `${opt.label}の上限 ${opt.maxKg}kg を超過 (請求 ${chargeable.toFixed(2)}kg)`;
    if (opt.service === "EMS") {
      const longest = Math.max(L, W, H);
      const sides = [L, W, H].sort((a,b) => b-a);
      const girth = sides[0] + 2*(sides[1] + sides[2]);
      if (longest > 150) { oversize = true; reason = `1辺が150cmを超過 (${longest}cm)`; }
      else if (girth > 300) { oversize = true; reason = `長さ+(横+高)*2 が300cmを超過 (${girth.toFixed(0)}cm)`; }
    }
    const fee = oversize ? null : lookupRate(chargeable, opt.table);
    return {
      service: opt.service,
      label: opt.label,
      desc: opt.desc,
      actual, vol, chargeable,
      feeJpy: fee,
      feeUsd: fee != null ? fee / fx : null,
      oversize: oversize || fee == null,
      reason,
    };
  }

  function calculate(input) {
    const country = COUNTRIES.find(c => c.code === input.country);
    const category = CATEGORIES.find(c => c.code === input.category);

    const shipping = SHIPPING.map(o => calcShipping(o, input.weight, input.L, input.W, input.H, input.fx));

    const ems = shipping.find(s => s.service === "EMS" && !s.oversize);
    const shipForDuty = (input.includeShip && ems && ems.feeUsd) ? ems.feeUsd : 0;
    const base = input.price + shipForDuty;
    const mfn = base * (category.mfn / 100);
    const recip = base * (country.r / 100);
    const totalDuty = mfn + recip;
    let mpf = base * MPF_RATE;
    if (mpf < MPF_MIN) mpf = MPF_MIN;
    if (mpf > MPF_MAX) mpf = MPF_MAX;

    const notes = [
      "2025年8月29日でde minimis ($800免税枠) が全世界で廃止 → 全貨物が関税対象",
      `相互関税は2025年中も変動しています (現在の代表値: ${country.name}=${country.r}%)`,
    ];
    if (country.code === "MX" || country.code === "CA") notes.push("USMCA原産品は通常無税。原産地証明があれば相互関税0%扱いになるケースあり");
    if (category.code === "electronics" || category.code === "cameras") notes.push("MFN税率は無税/低率だが、相互関税は別途課税される");
    if (ems && ems.oversize) notes.push("EMSが利用できないサイズ・重量です。FedEx/DHLでの送付を検討してください");

    const recommended = (ems && ems.feeJpy != null) ? {
      label: ems.label,
      jpy: ems.feeJpy,
      usd: ems.feeUsd,
      landed: input.price + totalDuty + ems.feeUsd + mpf,
    } : null;

    return {
      country, category, shipping,
      duty: {
        price: input.price,
        shipForDuty,
        base,
        mfnRate: category.mfn,
        reciRate: country.r,
        totalRate: category.mfn + country.r,
        mfn, recip, totalDuty,
        mpf, totalImport: totalDuty + mpf,
      },
      recommended, notes,
    };
  }

  // ============================================================
  // UI
  // ============================================================
  const fmtUsd = v => (v == null || !isFinite(v)) ? "—" : "$" + v.toFixed(2);
  const fmtJpy = v => (v == null || !isFinite(v)) ? "—" : "¥" + Math.round(v).toLocaleString("ja-JP");

  function populateSelects() {
    const cs = document.getElementById("country");
    cs.innerHTML = COUNTRIES.map(c => `<option value="${c.code}">${c.name} (相互関税 +${c.r}%)</option>`).join("");
    const ks = document.getElementById("category");
    ks.innerHTML = CATEGORIES.map(c => `<option value="${c.code}">${c.name} (MFN ${c.mfn}%)</option>`).join("");
    ks.value = "general";
  }

  function getInput() {
    return {
      country:   document.getElementById("country").value,
      category:  document.getElementById("category").value,
      price:     parseFloat(document.getElementById("price").value)  || 0,
      fx:        parseFloat(document.getElementById("fx").value)     || 155,
      weight:    parseFloat(document.getElementById("weight").value) || 0,
      L:         parseFloat(document.getElementById("lenL").value)   || 0,
      W:         parseFloat(document.getElementById("lenW").value)   || 0,
      H:         parseFloat(document.getElementById("lenH").value)   || 0,
      includeShip: document.getElementById("includeShip").checked,
    };
  }

  function render() {
    const input = getInput();
    const r = calculate(input);
    const root = document.getElementById("result");

    const shippingRows = r.shipping.map(s => `
      <tr class="ship-row">
        <td>
          <div class="ship-label">${s.label}</div>
          <div class="ship-desc">${s.desc}</div>
          ${s.reason ? `<div class="ship-warn">⚠ ${s.reason}</div>` : ""}
        </td>
        <td class="num">
          ${s.chargeable.toFixed(2)} kg
          <div class="sub">実${s.actual.toFixed(2)} / 容積${s.vol.toFixed(2)}</div>
        </td>
        <td class="num">${fmtJpy(s.feeJpy)}</td>
        <td class="num">${fmtUsd(s.feeUsd)}</td>
      </tr>
    `).join("");

    root.innerHTML = `
      <div class="panel">
        <h2>計算結果</h2>

        <div class="panel" style="background:var(--panel2); margin-top:0">
          <h3>関税 (米国輸入時)</h3>
          <div style="font-size:11px; color:var(--muted); margin-bottom:6px">
            <span class="pill">${r.country.name}</span><span class="pill">${r.category.name}</span>
          </div>
          <table>
            <tbody>
              <tr><td>商品代金</td><td class="num">${fmtUsd(r.duty.price)}</td></tr>
              <tr><td>課税対象送料 (${input.includeShip ? "含む" : "含まない"})</td><td class="num">${fmtUsd(r.duty.shipForDuty)}</td></tr>
              <tr class="row-bold"><td>課税ベース (CIF)</td><td class="num">${fmtUsd(r.duty.base)}</td></tr>
              <tr><td>MFN通常関税 (${r.duty.mfnRate}%)</td><td class="num">${fmtUsd(r.duty.mfn)}</td></tr>
              <tr><td>相互関税 / Reciprocal (${r.duty.reciRate}%)</td><td class="num">${fmtUsd(r.duty.recip)}</td></tr>
              <tr class="row-accent"><td>関税合計 (実効 ${r.duty.totalRate.toFixed(1)}%)</td><td class="num">${fmtUsd(r.duty.totalDuty)}</td></tr>
              <tr><td>MPF 処理手数料 (目安)</td><td class="num">${fmtUsd(r.duty.mpf)}</td></tr>
              <tr class="row-bold"><td>輸入諸経費合計</td><td class="num">${fmtUsd(r.duty.totalImport)}</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel" style="background:var(--panel2)">
          <h3>送料 (日本→米国)</h3>
          <table>
            <thead><tr><th>サービス</th><th style="text-align:right">請求重量</th><th style="text-align:right">JPY</th><th style="text-align:right">USD</th></tr></thead>
            <tbody>${shippingRows}</tbody>
          </table>
        </div>

        ${r.recommended
          ? `<div class="panel recommended">
              <h3 style="color:var(--accent2)">推奨: ${r.recommended.label} 利用時の総コスト</h3>
              <div style="font-size:11px; color:var(--muted)">送料 ${fmtJpy(r.recommended.jpy)} (${fmtUsd(r.recommended.usd)})</div>
              <div class="big">Landed Cost: ${fmtUsd(r.recommended.landed)}</div>
              <div style="font-size:11px; color:var(--muted); margin-top:2px">= 商品代金 + 関税 + 送料 + MPF (買い手が支払う総額の目安)</div>
            </div>`
          : `<div class="panel alert">EMSで発送できないサイズ・重量です。FedEx / DHL等の他キャリアを検討してください。</div>`
        }

        <div class="panel" style="background:var(--panel2)">
          <h3 style="color:var(--muted)">⚠ 注意事項</h3>
          <ul class="notes">
            ${r.notes.map(n => `<li>${n}</li>`).join("")}
            <li>本ツールは概算です。正確な関税は HTS コードと現行の Executive Order を、送料は日本郵便公式の最新料金表を必ずご確認ください。</li>
          </ul>
        </div>
      </div>
    `;
  }

  // 初期化 + 全入力にハンドラを設定
  populateSelects();
  document.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });
  render();
  </script>
</body>
</html>
